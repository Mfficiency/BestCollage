name: flutter test

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.4
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --timeout 60s
